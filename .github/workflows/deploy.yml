name: Deploy Amazon Connect with CloudFormation

on:
  push:
    branches:
      - main  # Runs only when changes are pushed to the main branch
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Change to your region

      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --stack-name amazon-connect-stack \
            --template-file C:\Users\walte\OneDrive\Desktop\Repos\amazonconnect\sky-amazon-connect\templats \
            --capabilities CAPABILITY_NAMED_IAM
